<div class="registration-new-activity-panel panel">
  <div class="client-edit-section-head">
    <span class="client-edit-section-icon">🎓</span>
    <div>
      <h2>Treinamento</h2>
      <p>Agende o treinamento. Ao salvar, esta é a segunda ordem de serviço, depois da entrada.</p>
    </div>
  </div>

  <label class="registration-new-toggle">
    <span>Criar treinamento junto com o cadastro</span>
    <span class="registration-toggle-switch">
      <input type="checkbox" id="create-first-activity-toggle" {% if values.get('create_training', '0') == '1' %}checked{% endif %}>
      <span class="registration-toggle-slider"></span>
    </span>
  </label>

  <div class="registration-activity-fields" id="registration-activity-fields">
    <div class="form-grid">
      <div class="form-group">
        <label>Nome do responsável</label>
        <input type="text" name="training_responsible" maxlength="120" placeholder="Quem responde pela empresa" value="{{ values.get('training_responsible', '') }}">
      </div>
      <div class="form-group">
        <label>Quantidade de funcionários</label>
        <input type="number" name="training_employees" min="1" step="1" value="{{ values.get('training_employees', '') }}" placeholder="Ex.: 12">
      </div>
      <div class="form-group">
        <label>Treinador</label>
        <select name="training_trainer_id">
          <option value="">Selecione o treinador</option>
          {% for trainer in trainers %}
          <option value="{{ trainer.id }}" {% if trainer.id == values.get('training_trainer_id', '') %}selected{% endif %}>{{ trainer.name }}</option>
          {% endfor %}
        </select>
        <p class="page-subtitle">Cadastre os treinadores em Sistema.</p>
      </div>
      <div class="form-group">
        <label>Data</label>
        <input type="date" name="training_date" value="{{ values.get('training_date', today) }}">
      </div>
      <div class="form-group">
        <label>Hora</label>
        <input type="time" name="training_time" value="{{ values.get('training_time', default_time) }}">
      </div>
      <div class="form-group full">
        <label>Link da videoconferência</label>
        <input type="url" name="training_link" maxlength="300" placeholder="https://..." value="{{ values.get('training_link', '') }}">
      </div>
    </div>
  </div>
</div>
