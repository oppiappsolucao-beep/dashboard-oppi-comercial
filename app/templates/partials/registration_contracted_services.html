<section class="client-edit-section panel" id="client-closed-services">
  <div class="client-edit-section-head">
    <span class="client-edit-section-icon">📦</span>
    <div>
      <h2>Serviços contratados</h2>
      <p>Controle interno: nome, quantidade e valor. Pode haver mais de um serviço por empresa. Não vai para o Asaas.</p>
    </div>
  </div>

  <div class="contracted-services-list" id="closed-services-track">
    {% for item in closed_services %}
    <div class="contracted-service-row form-grid cols-2">
      <div class="form-group">
        <label>Serviço</label>
        {% if service_catalog %}
        <select name="closed_servico" data-service-select>
          <option value="">Selecione</option>
          {% for service in service_catalog %}
          <option value="{{ service.name }}"
            data-valor="{{ service.valor }}"
            data-quantidade="{{ service.quantidade }}"
            {% if item.servico == service.name %}selected{% endif %}>{{ service.name }}</option>
          {% endfor %}
          {% if item.servico and item.servico not in service_options %}
          <option value="{{ item.servico }}" selected>{{ item.servico }}</option>
          {% endif %}
        </select>
        {% else %}
        <input type="text" name="closed_servico" value="{{ item.servico }}" placeholder="Nome do serviço">
        {% endif %}
      </div>
      <div class="form-group">
        <label>Quantidade</label>
        <input type="number" name="closed_quantidade" min="1" step="1" value="{{ item.quantidade or 1 }}">
      </div>
      <div class="form-group">
        <label>Valor do serviço</label>
        <input type="text" name="closed_valor" value="{{ item.valor }}" placeholder="R$ 0,00" autocomplete="off">
      </div>
      <div class="form-group">
        <label>Forma de pagamento</label>
        <select name="closed_forma_pagamento">
          {% for option in payment_method_options %}
          <option value="{{ option }}" {% if item.forma_pagamento == option %}selected{% endif %}>{{ option }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    {% endfor %}
  </div>

  <div class="client-closed-services-footer" style="margin-top: 12px; display:flex; gap:8px; flex-wrap:wrap;">
    <button type="button" class="btn btn-secondary" id="closed-services-add">+ Adicionar serviço</button>
    <button type="submit" name="action" value="save_financeiro" class="btn">Salvar serviços</button>
  </div>

  <template id="closed-services-slide-template">
    <div class="contracted-service-row form-grid cols-2">
      <div class="form-group">
        <label>Serviço</label>
        {% if service_catalog %}
        <select name="closed_servico" data-service-select>
          <option value="">Selecione</option>
          {% for service in service_catalog %}
          <option value="{{ service.name }}" data-valor="{{ service.valor }}" data-quantidade="{{ service.quantidade }}">{{ service.name }}</option>
          {% endfor %}
        </select>
        {% else %}
        <input type="text" name="closed_servico" value="" placeholder="Nome do serviço">
        {% endif %}
      </div>
      <div class="form-group">
        <label>Quantidade</label>
        <input type="number" name="closed_quantidade" min="1" step="1" value="1">
      </div>
      <div class="form-group">
        <label>Valor do serviço</label>
        <input type="text" name="closed_valor" value="" placeholder="R$ 0,00" autocomplete="off">
      </div>
      <div class="form-group">
        <label>Forma de pagamento</label>
        <select name="closed_forma_pagamento">
          {% for option in payment_method_options %}
          <option value="{{ option }}" {% if option == 'Mensal' %}selected{% endif %}>{{ option }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
  </template>
</section>
