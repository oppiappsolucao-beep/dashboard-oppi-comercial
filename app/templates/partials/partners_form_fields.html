{% set partner_values = values if values is defined else {} %}
{% set initial_count = partners_count if partners_count is defined else 0 %}

<div class="partners-form" data-initial-count="{{ initial_count }}">
  <div class="form-group">
    <label>Nome do responsável</label>
    <input name="responsavel_legal" value="{{ partner_values.get('responsavel_legal', '') or partner_values.get('socio_1', '') }}" placeholder="Nome de quem responde pela empresa">
  </div>
  <input type="hidden" name="socio_1" value="{{ partner_values.get('socio_1', '') }}">
  <input type="hidden" name="telefone_socio_1" value="{{ partner_values.get('telefone_socio_1', '') }}">
  <input type="hidden" name="cpf_socio_1" value="{{ partner_values.get('cpf_socio_1', '') }}">
  <input type="hidden" name="email_socio_1" value="{{ partner_values.get('email_socio_1', '') }}">
  <input type="hidden" name="socio_2" value="{{ partner_values.get('socio_2', '') }}">
  <input type="hidden" name="telefone_socio_2" value="{{ partner_values.get('telefone_socio_2', '') }}">
  <input type="hidden" name="cpf_socio_2" value="{{ partner_values.get('cpf_socio_2', '') }}">
  <input type="hidden" name="socio_3" value="{{ partner_values.get('socio_3', '') }}">
  <input type="hidden" name="telefone_socio_3" value="{{ partner_values.get('telefone_socio_3', '') }}">
  <input type="hidden" name="cpf_socio_3" value="{{ partner_values.get('cpf_socio_3', '') }}">

  <div class="partner-block partners-access-block">
    <div class="partner-block-title">Acesso e contatos administrativos</div>
    <div class="form-grid">
      <div class="form-group">
        <label>E-mail de login do gestor</label>
        <input name="email_login_gestor" type="email" value="{{ partner_values.get('email_login_gestor', '') }}" autocomplete="off">
      </div>
      <div class="form-group">
        <label>E-mail para confirmação do administrador</label>
        <input name="email_confirmacao_admin" type="email" value="{{ partner_values.get('email_confirmacao_admin', '') }}" autocomplete="off">
      </div>
      <div class="form-group">
        <label>E-mail para cobrança</label>
        <input name="email_cobranca" type="email" value="{{ partner_values.get('email_cobranca', '') }}" autocomplete="off">
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input name="senha_acesso" type="password" value="{{ partner_values.get('senha_acesso', '') }}" autocomplete="new-password">
      </div>
    </div>
  </div>
</div>
