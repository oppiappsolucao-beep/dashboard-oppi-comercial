<div class="client-edit-danger-actions">
  <button type="button" class="btn btn-danger client-edit-delete-btn" id="open-delete-modal">Excluir</button>
  <button type="submit" form="client-toggle-ativo-form" name="ativo" value="1" class="btn client-edit-flag {% if cadastro_ativo %}is-current{% else %}btn-secondary{% endif %}">Ativo</button>
  <button type="submit" form="client-toggle-ativo-form" name="ativo" value="0" class="btn client-edit-flag {% if not cadastro_ativo %}is-inactive{% else %}btn-secondary{% endif %}">Inativo</button>
</div>
